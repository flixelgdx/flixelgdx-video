# Manifest for the flxgdx CLI. Install this extension with:
#   flxgdx add library --repo flixelgdx/flixelgdx-video
schema: 1

# Every artifact below is published under this Maven group.
group: org.flixelgdx

# Release tags look like v0.7.2, and the artifact version is 0.7.2.
version-from-tag: strip-v

packages:
  - name: flixelgdx-video
    kind: library
    description: Cross-platform video playback for FlixelGDX games on desktop, web, and Android.
    modules:
      # The platform-neutral API your game code uses (FlixelVideo and FlixelVideos).
      core:
        libraries:
          - artifact: flixelgdx-video-core
      # The desktop backend already brings the libvlc natives along with it.
      desktop:
        libraries:
          - artifact: flixelgdx-video-desktop
      html5:
        libraries:
          - artifact: flixelgdx-video-html5
      android:
        libraries:
          - artifact: flixelgdx-video-android
    # Each platform needs one line in its launcher so the video backend is registered.
    notes:
      desktop: Call org.flixelgdx.backend.desktop.video.FlixelDesktopVideoHandler.install() before FlixelDesktopLauncher.launch(...).
      html5: Call org.flixelgdx.backend.html5.video.FlixelHtml5VideoHandler.install() before FlixelHtml5Launcher.launch(...).
      android: Call org.flixelgdx.backend.android.video.FlixelAndroidVideoHandler.install(this) in your activity's onCreate(...), before FlixelAndroidLauncher.launch(...).
