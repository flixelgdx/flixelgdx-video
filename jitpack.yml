# https://docs.jitpack.io
jdk:
  - openjdk17

# Publish all library artifacts to the local Maven repo for JitPack to pick up.
# The VLC natives are not packaged here (that only happens on the tagged Maven Central
# release), so JitPack builds are lightweight and fall back to a system VLC at runtime.
install:
  - ./gradlew publishToMavenLocal -PincludeAndroid=true --no-daemon
